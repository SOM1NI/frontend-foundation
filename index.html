<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>To-Do List</h1>
      <p id="today-label">Today</p>
    </div>
    <button class="text-button" id="clear-done" type="button">Clear done</button>
  </header>

  <main class="app">
    <section class="summary" aria-label="Task summary">
      <div>
        <span id="total-count">0</span>
        <p>Total</p>
      </div>
      <div>
        <span id="active-count">0</span>
        <p>Active</p>
      </div>
      <div>
        <span id="done-count">0</span>
        <p>Done</p>
      </div>
    </section>

    <section class="panel" aria-labelledby="add-task-title">
      <h2 id="add-task-title">Add a task</h2>
      <form class="task-form" id="task-form">
        <label class="wide-field">
          <span>Task</span>
          <input id="task-title" name="title" type="text" placeholder="Example: Pay electricity bill" autocomplete="off" required>
        </label>

        <label>
          <span>Due</span>
          <input name="dueDate" type="date">
        </label>

        <label>
          <span>Priority</span>
          <select name="priority">
            <option value="Normal">Normal</option>
            <option value="High">High</option>
            <option value="Low">Low</option>
          </select>
        </label>

        <button class="primary-button" type="submit">Add</button>
      </form>
    </section>

    <section class="toolbar" aria-label="Task tools">
      <div class="filters" role="group" aria-label="Task filters">
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="active">Active</button>
        <button class="filter" type="button" data-filter="done">Done</button>
      </div>

      <label class="search-box">
        <span class="sr-only">Search tasks</span>
        <input id="search" type="search" placeholder="Search tasks">
      </label>
    </section>

    <section class="task-section" aria-labelledby="task-list-title">
      <div class="list-heading">
        <h2 id="task-list-title">Tasks</h2>
        <p id="task-note">Saved on this device</p>
      </div>

      <ul class="task-list" id="task-list"></ul>
      <div class="empty-state" id="empty-state" hidden>
        <h3>No tasks here</h3>
        <p>Add something small and clear to get started.</p>
      </div>
    </section>
  </main>
</body>
</html>
